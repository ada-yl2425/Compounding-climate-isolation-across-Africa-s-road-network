name: Python Code Quality CI

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # Job 1: Code Formatting (Black)
  # ==========================================
  format-check:
    name: Code Style Check (Black)
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Formatter dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black

    - name: Check formatting with Black
      run: black --check --diff .

  # ==========================================
  # Job 2: Unit Testing (Pytest)
  # ==========================================
  test:
    name: Unit Tests
    needs: format-check  
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Project dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Test with pytest
      run: pytest